name: pism
channels:
  - conda-forge
dependencies:
  - python
  # Compilers & build tools
  - c-compiler
  - cxx-compiler
  - cmake >=3.20
  - stdlibs
  - pkg-config
  - make
  - swig
  - gnuconfig
  # MPI
  - libnetcdf=*=mpi_*
  - netcdf4=*=mpi_*
  - h5py=*=mpi_*
  - hdf5=*=mpi_*
  # Libraries
  - fftw
  - gsl >=1.15
  - udunits2
  - proj
  - libsqlite
  - libtiff
  - libcurl
  - zlib
  - liblzma-devel
  - libopenblas
  - petsc
  - petsc4py
  - scikit-build-core
  - yac=*=mpi_*
  - yaxt=*=mpi_*
  - ncview
  - wget
  # Python / analysis
  - pip
  - pip:
      - -r requirements.txt
